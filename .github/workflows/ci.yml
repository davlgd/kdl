name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # V master moves every day: catch a compiler change that breaks the module
    - cron: '0 5 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        # the checkout is in deps/kdl, and deps is VMODULES: `import kdl` resolves to
        # the code under test, never to a copy installed elsewhere
        working-directory: deps/kdl
    env:
      VMODULES: ${{ github.workspace }}/deps
      # fail instead of retrying silently with V's compatibility compiler
      V_MACOS_V3_NO_FALLBACK: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          path: deps/kdl

      - name: Set up V master
        id: setup_v
        uses: vlang/setup-v@v1.7
        with:
          check-latest: true
        # setup-v builds V master from source; on windows-latest that build itself
        # currently fails (V's own stdatomic/PeekNamedPipe C errors, before any code
        # of this module). Only this step is tolerated there: the checks below are
        # skipped when it fails and block again as soon as V master builds
        continue-on-error: ${{ matrix.os == 'windows-latest' }}

      - name: Report a V bootstrap failure
        if: steps.setup_v.outcome != 'success'
        run: |
          echo '::warning::V master did not build on ${{ matrix.os }}; the module checks were skipped'
          echo '### V master did not build on ${{ matrix.os }}, module checks skipped' >> "$GITHUB_STEP_SUMMARY"

      - name: V version
        if: steps.setup_v.outcome == 'success'
        run: |
          v version
          echo "V master resolved by setup-v: ${{ steps.setup_v.outputs.version }}"
          echo "V: $(v version), setup-v version: ${{ steps.setup_v.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Formatting
        if: steps.setup_v.outcome == 'success'
        run: v fmt -verify .

      - name: Vet
        if: steps.setup_v.outcome == 'success'
        run: v vet .

      - name: Documentation of public symbols
        if: steps.setup_v.outcome == 'success'
        run: v missdoc --verify .

      - name: Tests
        if: steps.setup_v.outcome == 'success'
        run: v -stats test .

      - name: Examples
        if: steps.setup_v.outcome == 'success'
        run: |
          for dir in examples/*/; do
            echo "::group::${dir}"
            v run "${dir}main.v"
            echo "::endgroup::"
          done

      - name: README code blocks compile
        if: steps.setup_v.outcome == 'success'
        # the 100-column limit of check-md is not a rule of this repository
        run: v check-md -silent -hide-warnings -skip-line-length-check README.md examples

  old-compiler:
    # V's previous compiler is still what `-old-compiler` and the compatibility
    # fallback use, and it compiles generics and GC roots differently
    name: ubuntu-latest, old compiler
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: deps/kdl
    env:
      VMODULES: ${{ github.workspace }}/deps
      V_C_ERROR_BUG_REPORT_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          path: deps/kdl

      - name: Set up V master
        uses: vlang/setup-v@v1.7
        with:
          check-latest: true

      - name: Tests
        run: v -old-compiler -stats test .

      - name: Examples
        run: |
          for dir in examples/*/; do
            echo "::group::${dir}"
            v -old-compiler run "${dir}main.v"
            echo "::endgroup::"
          done
